services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.240.2}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    image: ${SERVER_IMAGE:-crocpro-server:local}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      TRUST_PROXY: ${CADDY_PROXY_IP:-172.30.240.2}
      WORKER_RELAY_ADDRESS: relay:${RELAY_PORT_1:-9009}
      RELAY_ADDRESS: ${RELAY_HOST:?Set RELAY_HOST in .env}:${RELAY_PORT_1:-9009}
      RELAY_PASS: ${RELAY_PASS:?Set RELAY_PASS in .env}
      LIMIT_MAX_STUDENTS_PER_ASSIGNMENT: ${LIMIT_MAX_STUDENTS_PER_ASSIGNMENT:-100}
      LIMIT_MAX_ASSIGNMENT_BYTES: ${LIMIT_MAX_ASSIGNMENT_BYTES:-1073741824}
      LIMIT_MAX_SUBMISSION_BYTES: ${LIMIT_MAX_SUBMISSION_BYTES:-209715200}
      LIMIT_VPS_DISTRIBUTION_SLOTS: ${LIMIT_VPS_DISTRIBUTION_SLOTS:-10}
      LIMIT_VPS_TRANSFER_SLOTS: ${LIMIT_VPS_TRANSFER_SLOTS:-10}
    expose:
      - "3000"
    volumes:
      - ./data:/data
    networks:
      - proxy
      - relay
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  relay:
    image: schollz/croc:10.7.0
    restart: unless-stopped
    environment:
      CROC_PASS: ${RELAY_PASS:?Set RELAY_PASS in .env}
      CROC_PORTS: ${RELAY_PORT_1:-9009},${RELAY_PORT_2:-9010},${RELAY_PORT_3:-9011},${RELAY_PORT_4:-9012},${RELAY_PORT_5:-9013}
    networks:
      - relay
    ports:
      - "${RELAY_PORT_1:-9009}:${RELAY_PORT_1:-9009}/tcp"
      - "${RELAY_PORT_2:-9010}:${RELAY_PORT_2:-9010}/tcp"
      - "${RELAY_PORT_3:-9011}:${RELAY_PORT_3:-9011}/tcp"
      - "${RELAY_PORT_4:-9012}:${RELAY_PORT_4:-9012}/tcp"
      - "${RELAY_PORT_5:-9013}:${RELAY_PORT_5:-9013}/tcp"

networks:
  proxy:
    ipam:
      config:
        - subnet: ${CADDY_PROXY_SUBNET:-172.30.240.0/24}
  relay:
