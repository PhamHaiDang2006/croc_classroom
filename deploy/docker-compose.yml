services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    image: ${SERVER_IMAGE:-crocpro-server:local}
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      RELAY_HOST: ${RELAY_HOST:?Set RELAY_HOST in .env}
      RELAY_PORT: ${RELAY_PORT_1:-9009}
      RELAY_PASS: ${RELAY_PASS:?Set RELAY_PASS in .env}
      RELAY_PORTS: ${RELAY_PORTS:-9009,9010,9011,9012,9013}
      MAX_STUDENTS_PER_ASSIGNMENT: ${MAX_STUDENTS_PER_ASSIGNMENT:-100}
      MAX_ASSIGNMENT_BYTES: ${MAX_ASSIGNMENT_BYTES:-1073741824}
      MAX_SUBMISSION_BYTES: ${MAX_SUBMISSION_BYTES:-209715200}
      MAX_RELAY_DOWNLOADS: ${MAX_RELAY_DOWNLOADS:-10}
      MAX_RELAY_UPLOADS: ${MAX_RELAY_UPLOADS:-10}
    expose:
      - "3000"
    volumes:
      - ./data:/data
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  relay:
    image: schollz/croc:10.7.0
    restart: unless-stopped
    environment:
      CROC_PASS: ${RELAY_PASS:?Set RELAY_PASS in .env}
      CROC_PORTS: ${RELAY_PORTS:-9009,9010,9011,9012,9013}
    ports:
      - "${RELAY_PORT_1:-9009}:${RELAY_PORT_1:-9009}/tcp"
      - "${RELAY_PORT_2:-9010}:${RELAY_PORT_2:-9010}/tcp"
      - "${RELAY_PORT_3:-9011}:${RELAY_PORT_3:-9011}/tcp"
      - "${RELAY_PORT_4:-9012}:${RELAY_PORT_4:-9012}/tcp"
      - "${RELAY_PORT_5:-9013}:${RELAY_PORT_5:-9013}/tcp"
